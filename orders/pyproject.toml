[project]
name = "orders"
version = "0.1.0"
requires-python = ">=3.10"
description = "Orders service (FastAPI)"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.25",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["orders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
